<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=20260616" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=20260616" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=20260616" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20260616" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Scart Solutions Pvt Ltd builds reliable business technology, ERP software, POS systems, infrastructure, networking, and security solutions."
    />
    <title>Scart Solutions | Enterprise Business Technology</title>
    <script>
      (() => {
        const storageKey = 'scart-solutions-theme'
        let theme

        try {
          theme = window.localStorage.getItem(storageKey)
        } catch {
          theme = null
        }

        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }

        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
